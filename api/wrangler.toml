name = "onefamily-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Create the database once with:  npx wrangler d1 create onefamily
# then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "onefamily"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# The website address that may call this API from a browser.
ALLOWED_ORIGIN = "*"
